[project]
name = "filing-reconciler"
version = "0.1.0"
description = "Multi-document financial contradiction analyst: ingests filings, reconciles claims across documents, scores risk, and drafts an analyst memo with citations — gated by human review and backed by an eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "filing-reconciler" }]
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langsmith>=0.1.100",
    "numpy>=1.26",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
# Real LLM provider; the default runtime uses a deterministic stub so the repo
# runs end-to-end with no API keys.
anthropic = ["langchain-anthropic>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
# Cross-platform task entrypoints (Windows has no `make`).
filing-reconciler = "filing_reconciler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filing_reconciler", "app"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["filing_reconciler", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # FastAPI uses function calls (Depends/Query) in arg defaults
    "RUF012", # mutable class attrs without ClassVar — noisy with Pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
# mypy targets source only (filing_reconciler, app); tests are checked by pytest.

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "eval: end-to-end evaluation harness (may be slow)",
]
